<svg viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0b1f3a"/>
      <stop offset="30%" stop-color="#2c5c86"/>
      <stop offset="55%" stop-color="#d98a4a"/>
      <stop offset="72%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#fff3d6"/>
